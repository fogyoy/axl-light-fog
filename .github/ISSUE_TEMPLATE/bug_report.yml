name: 缺陷反馈
description: 报告可复现的问题
title: "[缺陷] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请使用公开、合成的示例描述问题。不要上传个人 vault、真实阅读内容或私人旁注；发布前检查截图和日志，移除个人信息。
  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian 版本
      placeholder: 例如 1.15.1
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: 例如 macOS 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用公开、合成的示例文本说明操作。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志或截图（可选）
      description: 上传前请检查并移除个人路径、vault 名称、文档内容等信息。
